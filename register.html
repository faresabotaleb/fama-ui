<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create account · Fama</title>
<link rel="icon" href="assets/img/fama-emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/shell.css?v=73">
<link rel="stylesheet" href="assets/css/ds.css?v=35">
<link rel="stylesheet" href="assets/css/auth.css?v=32">
</head><body>
<div data-fama-nav data-mode="auth"></div>
<script src="assets/js/ds.js?v=31"></script>
<script src="assets/js/auth.js?v=31"></script>
<main class="wrap"><div class="auth">
  <section class="au-show" id="show" aria-hidden="true"></section>
  <section class="pane">
    <span class="label" data-t="eyebrow"></span>
    <h2 class="h2" data-t="title"></h2>
    <p class="sub" data-t="sub"></p>
    <form id="form" novalidate>
      <!-- Account type (talent / brand) comes back with the client phase. The .type styles are kept in auth.css. -->
      <label class="f"><span data-t="name"></span><input class="in" id="name" autocomplete="name" maxlength="255" required><p class="help"></p></label>
      <label class="f"><span data-t="email"></span><input class="in" id="email" type="email" autocomplete="email" dir="ltr" required><p class="help"></p></label>
      <div class="f"><label class="lbl" for="pw" data-t="pw"></label><div class="pw"><input class="in" id="pw" type="password" autocomplete="new-password" dir="ltr" required><button type="button" data-pw="pw" aria-pressed="false" data-t="show"></button></div>
        <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p class="help" id="pwHelp" data-t="pwHelp"></p></div>
      <div class="f"><label class="lbl" for="pw2" data-t="pw2"></label><div class="pw"><input class="in" id="pw2" type="password" autocomplete="new-password" dir="ltr" required><button type="button" data-pw="pw2" aria-pressed="false" data-t="show"></button></div><p class="help"></p></div>
      <button class="btn btn-block"><svg class="icon" aria-hidden="true"><use href="#a-user-plus"/></svg><span data-t="cta"></span></button>
    </form>
    <p class="alt"><span data-t="have"></span> <a class="link" href="login.html" data-t="login"></a></p>
  </section>
</div></main>
<div data-fama-foot></div>
<script src="assets/js/shell.js?v=63"></script>
<script>
FAMA.T.en={eyebrow:"Join Fama",title:"Create your account",sub:"Your profile goes live at its own link straight away. Complete it and it\u2019s listed in the Creatives Index, where brands search.",type:"Account type",talent:"I'm a talent",talentS:"Model, photographer, stylist…",
 name:"Full name",email:"Email",pw:"Password",pw2:"Confirm password",show:"Show",pwHelp:"At least 8 characters, with a mix of letters, numbers and symbols.",cta:"Create account",have:"Already on Fama?",login:"Log in",
 eName:"Add your full name.",eEmail:"Enter an email address like name@studio.com.",eTaken:"This email already has an account. Log in instead.",ePw:"Use at least 8 characters, and mix in letters, numbers or symbols.",ePw2:"The passwords don't match."};
FAMA.T.ar={eyebrow:"انضم لفاما",title:"أنشئ حسابك",sub:"بروفايلك بيبدأ خاص. تقدر تنشره بعد ما فريقنا يوثّقه.",type:"نوع الحساب",talent:"أنا موهبة",talentS:"موديل، مصور، منسق…",
 name:"الاسم بالكامل",email:"الإيميل",pw:"كلمة السر",pw2:"تأكيد كلمة السر",show:"إظهار",pwHelp:"٨ حروف على الأقل، فيها حروف وأرقام ورموز.",cta:"إنشاء الحساب",have:"عندك حساب؟",login:"تسجيل الدخول",
 eName:"اكتب اسمك بالكامل.",eEmail:"اكتب إيميل زي name@studio.com.",eTaken:"الإيميل ده عليه حساب. سجّل دخول بدل كده.",ePw:"استخدم ٨ حروف على الأقل، وخلّط بين حروف وأرقام ورموز.",ePw2:"كلمتين السر مش زي بعض."};
const {t}=FAMA;FAMA.apply();FAMA.showcase(document.getElementById("show"));
const $=id=>document.getElementById(id);
$("pw").addEventListener("input",()=>$("meter").dataset.s=FAMA.strength($("pw").value));
$("form").addEventListener("submit",e=>{e.preventDefault();
  const ok=[FAMA.fieldError($("name"),$("name").value.trim()?"":t("eName")),
    FAMA.fieldError($("email"),!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($("email").value)?t("eEmail"):/^taken@/i.test($("email").value)?t("eTaken"):""),
    FAMA.fieldError($("pw"),FAMA.strength($("pw").value)<3?t("ePw"):""),
    FAMA.fieldError($("pw2"),$("pw2").value!==$("pw").value||!$("pw2").value?t("ePw2"):"")];
  const bad=ok.indexOf(false); if(bad>=0){[$("name"),$("email"),$("pw"),$("pw2")][bad].focus();return}
  location.href=FAMA.href("profile-structure.html?state=incomplete");
});
</script>
</body></html>
