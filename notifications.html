<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notifications · Fama</title>
<link rel="icon" href="assets/img/fama-emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/shell.css?v=75">
<link rel="stylesheet" href="assets/css/ds.css?v=35">
<style>
/* Screen: notifications — everything from the bell, grouped by when it happened.
   1 Nov 2026: in the Activity page's chunky language. Pill filters with counts, and each notification is its own card
   with one clear action for what it is (reply, review the credit, follow back…). The whole card opens it too. */
.nbar{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);flex-wrap:wrap}
.ngrp+.ngrp{margin-top:var(--s7)}
.ngrp h2{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);margin:0 0 var(--s3)}
.ngrp ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--s3)}
.nc{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:var(--s4);align-items:center;padding:var(--s5);background:var(--white);border:var(--border);border-radius:var(--radius);
  transition:border-color var(--duration-quick,150ms) ease-out,box-shadow var(--duration-quick,150ms) ease-out}
.nc:hover{border-color:#CFC9BE;box-shadow:0 6px 18px -12px rgba(20,17,15,.25)}
.nc.unread{background:linear-gradient(90deg,var(--lavender,#F3EAF8),var(--white) 55%);border-color:#E3D3EE}
.nc .ic{width:48px;height:48px;border-radius:var(--radius-pill);background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.nc.unread .ic{background:var(--ink);color:var(--cream)}
.nc .ic svg{width:20px;height:20px}
.nc .tx{min-width:0;display:grid;gap:4px}
.nc .tx a{color:var(--ink);text-decoration:none;font-size:16px;line-height:1.4}
.nc .tx a::after{content:"";position:absolute;inset:0;border-radius:inherit} /* the whole card opens it */
.nc .tx a:focus-visible{outline:none}
.nc:has(.tx a:focus-visible){outline:2px solid var(--purple-dk);outline-offset:2px}
.nc .tx b{font-weight:600}
.nc .ex{color:var(--grey);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc .ago{display:flex;align-items:center;gap:var(--s2);color:var(--grey);font-size:13px}
.nc .ago i{width:8px;height:8px;border-radius:var(--radius-pill);background:var(--purple)}
.nc .act{position:relative;z-index:1;flex:none} /* above the card's link */
@media (max-width:760px){
  .nc{grid-template-columns:40px minmax(0,1fr);padding:var(--s4);gap:var(--s3);align-items:start}
  .nc .ic{width:40px;height:40px}
  .nc .act{grid-column:2;justify-self:start}
  .nc .ex{white-space:normal}
}
</style></head><body>
<div data-fama-nav></div>
<div data-fama-hero data-tone="soft" data-photo="assets/img/banners/notifications-star.png" data-label="Your activity" data-title="Notifications" data-lead="Mentions, credits, comments and follows, newest first."></div>
<script src="assets/js/ds.js?v=31"></script>

<main class="wrap main">
  <section>
    <div class="nbar">
      <div class="ptabs" role="tablist" aria-label="Show" id="show"></div>
      <button class="btn btn-2" id="all"><svg class="icon" aria-hidden="true"><use href="#a-check"/></svg>Mark all as read</button>
    </div>
    <div id="list" style="margin-top:var(--s6)"></div>
  </section>
</main>
<div data-fama-foot></div>

<script src="assets/js/shell.js?v=64"></script>
<script>
const N=FAMA_NOTIFS; let show="all";
const GROUPS=[["Today",n=>n.day===0],["This week",n=>n.day>0&&n.day<7],["Earlier",n=>n.day>=7]];
/* the one action that fits each kind of notification */
const ACT={mention:["Reply","btn-2"],comment:["Reply","btn-2"],credit:["Review credit","btn"],"credit-ok":["View project","btn-2"],
  follow:["Follow back","btn"],like:["View post","btn-2"],system:["See your profile","btn-2"]};
const followed=new Set();
function item(n){
  const u=!N.isRead(n.id), a=ACT[n.t]||["Open","btn-2"], href=N.href(n.url);
  const act=n.t==="follow"
    ?`<button type="button" class="act btn ${followed.has(n.id)?"btn-2":""}" data-follow="${n.id}" aria-pressed="${followed.has(n.id)}">${followed.has(n.id)?"Following":a[0]}</button>`
    :`<a class="act btn ${a[1]==="btn-2"?"btn-2":""}" href="${href}" data-nid="${n.id}">${a[0]}</a>`;
  return `<li class="nc${u?" unread":""}">
    <span class="ic" aria-hidden="true"><svg class="fx-icon"><use href="#${N.icon(n)}"/></svg></span>
    <div class="tx"><a href="${href}" data-nid="${n.id}"><b>${n.who}</b> ${n.txt}</a>${n.ex?`<span class="ex">${n.ex}</span>`:""}
      <span class="ago">${u?'<i aria-hidden="true"></i>':""}${n.ago}${u?'<span class="fx-vh"> · unread</span>':""}</span></div>
    ${act}</li>`;
}
const FILTERS=[["all","All",()=>true],["unread","Unread",n=>!N.isRead(n.id)],["mention","Mentions",n=>n.t==="mention"]];
function render(){
  document.getElementById("show").innerHTML=FILTERS.map(([v,l,f])=>`<button role="tab" data-v="${v}" aria-selected="${v===show}">${l}<span class="n">${N.all().filter(f).length}</span></button>`).join("");
  const l=N.all().filter(FILTERS.find(x=>x[0]===show)[2]);
  document.getElementById("list").innerHTML=l.length?GROUPS.map(([g,f])=>{const x=l.filter(f);return x.length?`<section class="ngrp"><h2>${g}</h2><ul>${x.map(item).join("")}</ul></section>`:""}).join("")
    :`<div class="empty"><h3 class="h2">${show==="unread"?"You're all caught up":"Nothing here yet"}</h3><p>${show==="mention"?"When someone mentions you in a post or comment, it shows up here.":"New notifications show up here."}</p></div>`;
  document.getElementById("all").disabled=!N.unread();
}
document.getElementById("show").onclick=e=>{const b=e.target.closest("button");if(!b)return;show=b.dataset.v;render();document.querySelector('#show [aria-selected="true"]').focus()};
document.getElementById("all").onclick=()=>{N.readAll();render();FAMA.toast("All marked as read")};
document.getElementById("list").addEventListener("click",e=>{
  const f=e.target.closest("[data-follow]");
  if(f){const id=f.dataset.follow,n=N.all().find(x=>x.id===id);N.read(id);
    if(followed.has(id)){followed.delete(id);FAMA.toast(`Unfollowed ${n.who}`)}else{followed.add(id);FAMA.toast(`You follow ${n.who} now`)}
    render();return}
  const a=e.target.closest("[data-nid]");if(a)N.read(a.dataset.nid)});
render();
</script>
</body></html>
