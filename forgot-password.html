<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot password · Fama</title>
<link rel="icon" href="assets/img/fama-emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/shell.css?v=48">
<link rel="stylesheet" href="assets/css/ds.css?v=35">
<link rel="stylesheet" href="assets/css/auth.css?v=31b">
</head><body>
<div data-fama-nav data-mode="auth"></div>
<script src="assets/js/ds.js?v=31"></script>
<script src="assets/js/auth.js?v=31"></script>
<main class="wrap"><section class="pane solo" id="pane">
  <div id="ask">
    <span class="label" data-t="eyebrow"></span>
    <h1 class="h2" data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
    <form id="form" novalidate>
      <label class="f"><span data-t="email"></span><input class="in" id="email" type="email" autocomplete="email" dir="ltr" required><p class="help"></p></label>
      <button class="btn btn-block"><span data-t="cta"></span></button>
    </form>
    <p class="alt"><a class="link" href="login.html" data-t="back"></a></p>
  </div>
  <div id="sent" class="done" hidden role="status">
    <span class="ic"><svg class="icon" style="width:32px;height:32px" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
    <h1 class="h2" data-t="sentT"></h1>
    <p class="sub" id="sentP"></p>
    <p class="alt"><button type="button" class="link" id="again" data-t="again"></button></p>
  </div>
</section></main>
<div data-fama-foot></div>
<script src="assets/js/shell.js?v=55"></script>
<script>
FAMA.T.en={eyebrow:"Password help",title:"Forgot your password?",sub:"Enter your email and we'll send you a link to choose a new password.",email:"Email",cta:"Email reset link",back:"Back to log in",
 sentT:"We've emailed your reset link",sentP:e=>`Check ${e}. The link works for one hour. If it doesn't arrive, look in spam.`,again:"Use a different email",eEmail:"Enter an email address like name@studio.com."};
FAMA.T.ar={eyebrow:"مساعدة في كلمة السر",title:"نسيت كلمة السر؟",sub:"اكتب إيميلك وهنبعتلك رابط تختار بيه كلمة سر جديدة.",email:"الإيميل",cta:"ابعت الرابط",back:"ارجع لتسجيل الدخول",
 sentT:"بعتنالك رابط تغيير كلمة السر",sentP:e=>`بص على ${e}. الرابط شغال لمدة ساعة. لو موصلش، بص في الـ spam.`,again:"استخدم إيميل تاني",eEmail:"اكتب إيميل زي name@studio.com."};
const {t,esc}=FAMA;FAMA.apply();const $=id=>document.getElementById(id);
$("form").addEventListener("submit",e=>{e.preventDefault();
  if(!FAMA.fieldError($("email"),/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($("email").value)?"":t("eEmail"))){$("email").focus();return}
  $("sentP").textContent=t("sentP",$("email").value);$("ask").hidden=true;$("sent").hidden=false;$("sent").querySelector("h1").focus?.();
});
$("again").onclick=()=>{$("sent").hidden=true;$("ask").hidden=false;$("email").select()};
</script>
</body></html>
