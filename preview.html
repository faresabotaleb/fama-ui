<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo talent · Fama</title>
<link rel="icon" href="assets/img/fama-emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/shell.css?v=48">
<link rel="stylesheet" href="assets/css/ds.css?v=35">
<link rel="stylesheet" href="assets/css/fields.css?v=9">
<link rel="stylesheet" href="assets/css/exp.css?v=2">
<style>
/* Screen: /{username}?skill={skill} — "Talent profile" in the Fama V1 Blueprint.
   Also the talent's own Preview (with a strip that says so).
   Review states: ?view=guest (a visitor, public top bar) · ?state=unpublished · ?skill=modelling */
.pv-strip{background:var(--ink);color:var(--cream)}
.pv-strip .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:52px;flex-wrap:wrap;padding-block:var(--s2)}
.pv-strip a{color:var(--yellow);font-weight:600;text-decoration:none}

/* profile header — the purple block and the one pattern on this page */
.phero{margin-top:var(--s6);background:var(--purple);color:var(--white);border-radius:var(--radius);overflow:hidden}
.phero .body{padding:var(--s7);display:flex;align-items:center;gap:var(--s6);flex-wrap:wrap}
.phero .ring{width:112px;height:112px;flex:none;border-radius:var(--radius-pill);background:var(--white);color:var(--purple-dk);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:40px}
.phero .id{flex:1;min-width:240px}
.phero h1{font-family:var(--font-display);font-weight:600;font-size:clamp(40px,5vw,64px);line-height:1}
.phero .who{font-weight:600;font-size:20px;margin-top:var(--s2)}
.now{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.now span{background:var(--white);color:var(--ink);border-radius:var(--radius-pill);padding:2px var(--s3);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.now .on::before{content:"";width:8px;height:8px;border-radius:var(--radius-pill);background:var(--mint-fg)}
.acts{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;position:relative}
.acts .ionly{width:48px;padding-inline:0;justify-content:center}
.band{height:20px;background:url("assets/img/pattern-stars.png") repeat-x;background-size:auto 100%}
/* photo hero (6 Oct 2026): the talent's details on purple, a photo on the right, the logo star on the seam */
.phero.ph{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 40%;min-height:280px}
.phero.ph .body{position:relative;z-index:2;align-self:center}
.phero.ph .acts{flex-basis:100%;margin-top:var(--s2)}
.phero.ph .photo{align-self:stretch;min-height:280px;background:#CBBBA8 url("assets/img/banners/profile.jpg?v=2") center/cover no-repeat}
.phero.ph .hstar{position:absolute;z-index:1;height:200px;left:calc(60% - 110px);bottom:-36px;fill:var(--yellow)}
.guestpop{position:relative}
dialog.signdlg{max-width:440px}
.signdlg p{color:var(--grey);margin-top:var(--s3)}
.signdlg .acts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s5)}
.signdlg .acts .btn{justify-content:center}
@media (max-width:480px){.signdlg .acts{grid-template-columns:1fr}}
.signin{position:absolute;z-index:5;inset-inline-end:0;top:calc(100% + var(--s2));width:300px;background:var(--white);color:var(--ink);border:var(--border);border-radius:var(--radius);padding:var(--s5)}
.signin b{display:block;font-weight:600;font-size:var(--t-h3)}
.signin p{color:var(--grey);margin:var(--s1) 0 var(--s4);font-size:15px}
.signin .row{display:flex;gap:var(--s2);flex-wrap:wrap}

/* intro: bio, point of view, links + stats */
.intro{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s6);margin-top:var(--s7);align-items:start}
.bio{font-size:18px;max-width:62ch}
/* point of view: plain text with its own heading, not a quote */
.pov{margin-top:var(--s6);max-width:62ch}
.pov h2{font-weight:600;font-size:15px;color:var(--grey);margin:0 0 var(--s1)}
.pov p{font-size:18px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);text-align:center}
.stats div+div{border-inline-start:var(--border)}
.stats b{display:block;font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.1}
[dir=rtl] .stats b{font-family:var(--ar);font-weight:700}
.stats span{font-size:var(--t-meta);color:var(--grey)}
/* social links: icons only, the platform read from each link */
.social{list-style:none;margin:var(--s5) 0 0;padding:var(--s5) 0 0;border-top:var(--border);display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:center}
.social a{width:44px;height:44px;border-radius:var(--radius-pill);border:var(--border);background:var(--white);color:var(--ink);display:flex;align-items:center;justify-content:center}
.social a:hover{border-color:var(--ink);color:var(--purple-dk)}
.soc-ic{width:20px;height:20px;flex:none}

/* skill tabs — sticky under the top bar; active tab filled in orchid (dark step for AA) */
.stabs{position:sticky;top:72px;z-index:20;background:var(--cream);margin-top:var(--s8);border-bottom:var(--border)}
.stabs .row{display:flex;gap:var(--s6);overflow-x:auto;scrollbar-width:none}
.stabs a{flex:none;min-height:52px;display:inline-flex;align-items:center;gap:var(--s2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600;color:var(--grey);text-decoration:none;white-space:nowrap}
.stabs a:hover{color:var(--ink)}
.stabs a[aria-selected=true]{color:var(--ink);border-bottom-color:var(--purple-dk)}
/* 24 Oct 2026: the skill names in the display face, and the FAMA star on the open one */
.stabs a{font-family:var(--font-display);font-size:19px;letter-spacing:.01em}
@media (max-width:760px){.stabs a{font-size:16px}.stabs .row{gap:var(--s4)}}
.stabs .tstar{width:13px;height:12px;fill:var(--yellow);stroke:var(--ink);stroke-width:36;stroke-linejoin:round;flex:none;display:none}
.stabs a[aria-selected=true] .tstar{display:block}
.stabs .n{font-family:var(--font-body,inherit);font-size:12px;font-weight:600;min-width:20px;padding:0 6px;border-radius:var(--radius-pill);background:var(--line);color:#4F4A45;text-align:center;letter-spacing:0}
.stabs a[aria-selected=true] .n{background:var(--ink);color:var(--cream)}
.stabs a:focus-visible{outline:2px solid var(--purple-dk);outline-offset:-2px;border-radius:var(--s1)}
.specs{margin-top:var(--s6)}

/* sections */
.blk{margin-top:var(--s8)}
/* Contra-style top (9 Oct 2026) */
.ct-top{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:var(--s7);align-items:start;margin-top:var(--s6)}
.ct-id{display:flex;flex-direction:column;align-items:flex-start;padding-block:var(--s4)}
.ct-av{position:relative;width:80px;height:80px;border-radius:var(--radius-pill);background:var(--purple) center/cover;color:var(--white);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:28px}
.ct-on{position:absolute;right:2px;bottom:2px;width:16px;height:16px;border-radius:var(--radius-pill);background:#2BB673;border:3px solid var(--cream)}
.ct-id h1{font-family:var(--font-display);font-weight:600;font-size:44px;line-height:1.05;margin-top:var(--s4)}
.ct-who{color:var(--grey);margin-top:var(--s2);font-size:17px;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s4)}
.ct-place{display:inline-flex;align-items:center;gap:6px;font-size:15px}
.ct-place .icon{width:16px;height:16px}
.ct-links{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--s2);flex-basis:100%}
.ct-links a{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:var(--border);border-radius:var(--radius-pill);background:var(--white);color:var(--ink);font-size:14px;font-weight:600;text-decoration:none}
.ct-links a:hover{border-color:var(--ink)}
.ct-links .soc-ic{width:18px;height:18px}
.ct-acts{display:flex;gap:var(--s2);margin-top:var(--s5);flex-wrap:wrap;align-items:center}
.signalt{margin:var(--s4) 0 0;font-size:14px;color:var(--grey)}
.ct-stats{display:flex;gap:var(--s6);margin:var(--s4) 0 0}
.ct-stats div{padding:0}

.ct-stats dd{margin:0;font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.1;order:-1}
.ct-stats dt{font-size:12px;color:var(--grey)}
.ct-stats div{display:flex;flex-direction:column}
.ct-chips{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4)}
.ct-chips span{display:inline-flex;align-items:center;gap:6px;border:var(--border);background:var(--white);border-radius:var(--s3);padding:var(--s2) var(--s3);font-size:14px;font-weight:600}
.ct-chips .on::before{content:"";width:8px;height:8px;border-radius:var(--radius-pill);background:var(--ink)}
.ct-chips .on{background:var(--yellow);border-color:var(--yellow)} /* 24 Oct 2026: availability is the yellow signal */
.ct-skills{display:flex;flex-wrap:wrap;gap:var(--s2);list-style:none;margin:var(--s4) 0 0;padding:0}
.ct-skills a{display:inline-flex;align-items:center;min-height:36px;padding:0 var(--s3);border-radius:var(--radius-pill);background:var(--lavender,#F3EAF8);color:var(--purple-dk);font-weight:600;font-size:14px;text-decoration:none;transition:background-color var(--duration-quick,150ms) ease-out}
.ct-skills a:hover{background:var(--lavender-line,#E9DAF2)}
.ct-skills a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ct-with{margin:var(--s3) 0 0;font-size:15px;line-height:1.5;color:var(--ink);max-width:44ch}
.ct-with span{color:var(--grey)}
.ct-bio{margin:var(--s3) 0 0;font-size:17px;line-height:1.5;color:var(--ink);max-width:40ch;text-wrap:pretty}
#page p,#page li{text-wrap:pretty}
.povq{margin:var(--s4) 0 0;max-width:62ch;font-size:20px;line-height:1.5}
.wide-sections>.h1{margin:0}
@media (max-width:760px){.ct-stats{gap:var(--s5)}.ct-links a{width:44px;height:44px}}
.ct-cover{position:relative;border-radius:var(--radius);background:#CBBBA8 url("assets/img/banners/profile.jpg?v=2") center/cover no-repeat;min-height:340px;overflow:hidden}
.ct-cover{display:block;text-decoration:none;color:var(--white);background-size:cover;background-position:center;transition:transform var(--slow) var(--ease)}
.ct-cover.empty{background:var(--lavender,#F3EAF8)}
/* the featured project, with its frosted bar (24 Oct 2026) */
.ct-tags{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin-top:var(--s4)}
.ct-tags .ct-chips,.ct-tags .ct-skills{margin:0}
/* 24 Oct 2026: the hero fits one screen: the cover is as tall as the screen allows (below the nav and strip), never taller,
   so its featured-project bar is always in view */
/* the year of a project, as a tag on its picture (24 Oct 2026) */
.ptag{position:absolute;top:var(--s3);inset-inline-start:var(--s3);z-index:2;display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:var(--radius-pill);background:rgba(255,255,255,.94);color:var(--ink);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em;pointer-events:none;box-shadow:0 1px 4px rgba(20,17,15,.12)}
.ct-coverwrap>.ptag{top:var(--s4);inset-inline-start:var(--s4);height:30px;padding:0 12px;font-size:13px}
.ct-coverwrap{position:relative;min-width:0;height:clamp(340px,calc(100svh - 260px),620px)}
.ct-coverwrap .ct-cover{height:100%;min-height:0}
.ct-feat{position:absolute;inset:auto var(--s4) var(--s4);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:2px var(--s4);align-items:center;padding:var(--s3) var(--s4);border-radius:var(--s4);background:rgba(20,17,15,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ct-badge{grid-column:1/-1;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--yellow);letter-spacing:.02em}
.ct-badge svg{width:14px;height:13px;fill:var(--yellow)}
.ct-ft b{display:block;font-weight:600;font-size:17px}
.ct-ft small{display:block;font-size:13px;color:rgba(255,255,255,.9)}
.ct-go{width:40px;height:40px;border-radius:var(--radius-pill);background:var(--white);color:var(--ink);display:flex;align-items:center;justify-content:center;transition:transform var(--fast) var(--ease)}
.ct-go .icon{width:18px;height:18px}
.ct-cover:hover .ct-go{transform:translateX(3px)}
.ct-cover:focus-visible{outline:2px solid var(--purple-dk);outline-offset:3px}
/* one tab row: skills and About, with the place and links at its end */
.stabs{display:flex;align-items:center;gap:var(--s5);margin-top:var(--s7)}
.stabs .row{flex:1;min-width:0}
.ct-where{display:flex;align-items:center;gap:var(--s2);flex:none;color:var(--grey);font-size:14px}
.ct-where>span{display:inline-flex;align-items:center;gap:6px;margin-inline-end:var(--s2)}
.ct-where .icon{width:16px;height:16px}
.stabs .ct-where a{min-height:0;margin:0;border-bottom:var(--border);padding:0;flex:none;width:32px;height:32px;border-radius:var(--radius-pill);border:var(--border);background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ct-where a .soc-ic{width:15px;height:15px}
.ct-where a:hover{border-color:var(--ink)}
/* the work: a tight grid, the title shows on hover and focus */
#skillBody .specs-row{margin-top:var(--s5)}
#skillBody .blk:first-of-type{margin-top:var(--s4)}
#skillBody .blk-projects>.pv-sh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap} /* the tab already names it; screen readers still get the heading */
#skillBody .blk-projects{margin-top:var(--s4)}
#skillBody .projs{grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;margin-top:0}
.proj{position:relative;overflow:hidden}
.proj .ph{aspect-ratio:4/3;border-radius:0}
.ph.cover{background-size:cover;background-position:center}
.proj b,.proj .meta{position:absolute;inset-inline:0;padding-inline:var(--s3);color:var(--white);opacity:0;transform:translateY(6px);transition:opacity var(--fast) var(--ease),transform var(--fast) var(--ease);margin:0;font-size:15px}
.proj b{bottom:24px}
.proj .meta{bottom:8px;font-size:13px;color:rgba(255,255,255,.85)}
.proj::after{content:"";position:absolute;inset:auto 0 0;height:60%;background:linear-gradient(transparent,rgba(20,17,15,.7));opacity:0;transition:opacity var(--fast) var(--ease);pointer-events:none}
.proj b,.proj .meta{z-index:1}
.proj:hover::after,.proj:focus-visible::after,.proj:hover b,.proj:hover .meta,.proj:focus-visible b,.proj:focus-visible .meta{opacity:1;transform:none}
.proj:hover b{color:var(--white)}
/* each project is its own card, the title and client always under the picture: on phones since 11 Oct 2026
   (Muhammad's review), and on desktop too since 24 Oct 2026, so a brand scanning the grid reads the clients without hovering */
@media all{
  #skillBody .projs{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s6) var(--s4)}
  .proj{overflow:visible;text-decoration:none;display:flex;flex-direction:column;gap:2px}
  .proj .ph{aspect-ratio:4/3;border-radius:var(--s3);margin-bottom:var(--s2);transition:transform var(--slow) var(--ease)}
  .proj:hover .ph{transform:scale(.985)}
  .proj::after{display:none}
  .proj b,.proj .meta{position:static;opacity:1;transform:none;padding:0;color:var(--ink);font-weight:600;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .proj .meta{color:var(--grey);font-weight:400;font-size:13px;-webkit-line-clamp:1}
  .proj:hover b{color:var(--purple-dk)}
}
@media (max-width:760px){#skillBody .projs{gap:var(--s5) var(--s3)}.proj .ph{aspect-ratio:1}.proj b,.proj .meta{font-size:14px}.proj .meta{font-size:12px}}
.ct-about{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--s7);margin-top:var(--s7);padding-top:var(--s6);border-top:var(--border)}
.ct-about .bio{font-size:20px;line-height:1.55;margin:0}
.ct-about .pov{margin:0}
.ct-about .pov p{font-size:16px;line-height:1.6;color:var(--ink)}
@media (max-width:760px){.ct-about{grid-template-columns:minmax(0,1fr);gap:var(--s4);margin-top:var(--s5)}.ct-about .bio{font-size:18px}}
@media (max-width:960px){
  .ct-top{grid-template-columns:minmax(0,1fr);gap:var(--s5)}
  .ct-cover{min-height:220px;order:-1}
  .ct-coverwrap{order:-1;height:auto}
  #skillBody .projs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stabs{flex-wrap:wrap;gap:var(--s2)}
  .ct-where{width:100%;padding-bottom:var(--s3)}
}
/* two columns (9 Oct 2026) */
.pv-cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--s7);margin-top:var(--s7);align-items:start}
.pv-main .stabs{margin-top:0}
.pv-main .blk:first-of-type{margin-top:var(--s6)}
.pv-side{display:grid;gap:var(--s4)}
.side-rest{display:grid;gap:var(--s4)}
.pv-card{background:var(--white);border:var(--border);border-radius:var(--radius);padding:var(--s5)}
.side-about .bio{font-size:16px;line-height:1.55}
.side-about .pov{margin-top:var(--s3);color:var(--grey);font-size:15px;line-height:1.55}
.side-about .stats{margin-top:var(--s5);padding-top:var(--s4);border-top:var(--border);text-align:start;grid-template-columns:repeat(2,minmax(0,1fr))}
.side-about .stats div+div{border:0}
.side-about .social{justify-content:flex-start;margin-top:var(--s4);padding-top:0;border-top:0}
.side-h{font-weight:600;font-size:15px;color:var(--grey);margin:0 0 var(--s3)}
.side-xp{list-style:none;margin:0;padding:0}
.side-xp li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-top:var(--border)}
.side-xp li:first-child{border-top:0;padding-top:0}
.side-xp .lg svg{width:18px;height:18px;color:var(--purple-dk)}
.side-xp .lg{width:36px;height:36px;border-radius:10px;background:var(--cream);border:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.side-xp b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.side-xp small{display:block;color:var(--grey);font-size:13px}
.side-xp em{font-style:normal;color:var(--grey);font-size:13px;white-space:nowrap}
.side-q{display:block;font-size:16px;line-height:1.5}
.pv-card .by{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3)}
.pv-card .by b{display:block;font-weight:600;font-size:14px}
.pv-card .by .meta{display:block;font-size:13px}
.side-more{display:inline-flex;align-items:center;min-height:44px;margin-top:var(--s2);margin-bottom:calc(-1 * var(--s2));border:0;background:none;padding:0;font:inherit;font-weight:600;font-size:15px;color:var(--purple-dk);cursor:pointer}
.side-more:hover{color:var(--ink)}
.side-ex{list-style:none;margin:0;padding:0}
.side-ex li+li{margin-top:var(--s3);padding-top:var(--s3);border-top:var(--border)}
.side-ex b{font-weight:600}.side-ex span{color:var(--grey)}
.side-ex small{display:block;color:var(--grey);font-size:14px;margin-top:2px}
dialog.sheet{max-width:720px;width:calc(100% - 32px);padding:0;max-height:86vh}
dialog.sheet .dh{display:flex;justify-content:space-between;align-items:center;padding:var(--s5) var(--s6);border-bottom:var(--border)}
dialog.sheet .dh h2{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0}
dialog.sheet .sheet-b{padding:var(--s5) var(--s6);overflow:auto;max-height:calc(86vh - 80px)}
.sheet-recs{list-style:none;margin:0;padding:0}
.sheet-recs li{padding:var(--s4) 0;border-top:var(--border)}.sheet-recs li:first-child{border-top:0;padding-top:0}
.sheet-recs q{display:block;font-size:17px;line-height:1.5}
.sheet-recs .by{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3)}.sheet-recs .by b{display:block;font-weight:600;font-size:14px}.sheet-recs .meta{display:block;font-size:13px}
@media (max-width:960px){
  /* phone and tablet: about first, then the work, then the rest */
  .pv-cols{display:flex;flex-direction:column;gap:var(--s5)}
  .pv-side{display:contents}
  .side-about{order:0}.pv-main{order:1;width:100%}.side-rest{order:2}
}
/* profile-wide part (7 Oct 2026): under the skill tabs, set apart, so nothing here reads as belonging to the open skill */
.wide-sections{margin-top:var(--s9);padding-top:var(--s7);border-top:2px solid var(--ink)}

  document.body.appendChild(d);

  d.addEventListener("click",e=>{if(e.target===d)d.close()});
  d.addEventListener("close",()=>{d.remove();btn.focus()});
  d.showModal(); d.querySelector(".acts a").focus();
}

/* lightbox: every picture in a section, with previous / next, arrow keys and a count */
const lb=document.getElementById("lb"); let lbSet=[], lbI=0, lbFrom=null;
function lbItems(key){
  const [kind,id,n]=key.split(":");
  if(kind==="gallery") return (C.gallery[id]||[]).map(c=>[id+c,c]);
  if(kind==="digitals") return (C.digitals[id]||[]).map(d=>["dig"+d[0],d[0]+" · "+t("taken",FAMA.date(d[1]))]);
  if(kind==="look"){const l=C.looks[id][+n];return Array.from({length:l[1]},(_,i)=>[l[0]+(i+1),`${l[0]} · ${i+1}`])}
  return [];
}
function lbShow(){
  const [k,cap]=lbSet[lbI];
  document.getElementById("lbCap").textContent=cap;
  document.getElementById("lbN").textContent=lbSet.length>1?t("of",lbI+1,lbSet.length):"";
  document.getElementById("lbPrev").hidden=document.getElementById("lbNext").hidden=lbSet.length<2;
}
function openLb(key,i,from){lbSet=lbItems(key);if(!lbSet.length)return;lbI=i||0;lbFrom=from;lbShow();lb.showModal();document.getElementById("lbNext").focus()}
const step=d=>{lbI=(lbI+d+lbSet.length)%lbSet.length;lbShow()};
document.getElementById("lbPrev").onclick=()=>step(-1);
document.getElementById("lbNext").onclick=()=>step(1);
document.getElementById("lbX").onclick=()=>lb.close();
lb.addEventListener("keydown",e=>{if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});
lb.addEventListener("click",e=>{if(e.target===lb)lb.close()});
lb.addEventListener("close",()=>lbFrom&&lbFrom.focus());
</script>
