<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset password · Fama</title>
<link rel="icon" href="assets/img/fama-emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/shell.css?v=75">
<link rel="stylesheet" href="assets/css/ds.css?v=35">
<link rel="stylesheet" href="assets/css/auth.css?v=32">
</head><body>
<div data-fama-nav data-mode="auth"></div>
<script src="assets/js/ds.js?v=31"></script>
<script src="assets/js/auth.js?v=31"></script>
<main class="wrap"><section class="pane solo">
  <div id="ask">
    <span class="label" data-t="eyebrow"></span>
    <h1 class="h2" data-t="title"></h1>
    <form id="form" novalidate>
      <label class="f"><span data-t="email"></span><input class="in" id="email" type="email" dir="ltr" value="talent-demo@fama.test" readonly><p class="help" data-t="fromLink"></p></label>
      <div class="f"><label class="lbl" for="pw" data-t="pw"></label><div class="pw"><input class="in" id="pw" type="password" autocomplete="new-password" dir="ltr" required><button type="button" data-pw="pw" aria-pressed="false" data-t="show"></button></div>
        <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p class="help" data-t="pwHelp"></p></div>
      <div class="f"><label class="lbl" for="pw2" data-t="pw2"></label><div class="pw"><input class="in" id="pw2" type="password" autocomplete="new-password" dir="ltr" required><button type="button" data-pw="pw2" aria-pressed="false" data-t="show"></button></div><p class="help"></p></div>
      <button class="btn btn-block"><span data-t="cta"></span></button>
    </form>
  </div>
  <div id="done" class="done" hidden role="status">
    <span class="ic"><svg class="icon" style="width:32px;height:32px" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
    <h1 class="h2" data-t="doneT"></h1>
    <p class="sub" data-t="doneP"></p>
    <a class="btn btn-block" href="login.html"><svg class="icon" aria-hidden="true"><use href="#a-log-in"/></svg><span data-t="login"></span></a>
  </div>
</section></main>
<div data-fama-foot></div>
<script src="assets/js/shell.js?v=64"></script>
<script>
FAMA.T.en={eyebrow:"Password help",title:"Choose a new password",email:"Email",fromLink:"Filled in from your reset link.",pw:"New password",pw2:"Confirm new password",show:"Show",pwHelp:"At least 8 characters, with a mix of letters, numbers and symbols.",cta:"Save new password",
 doneT:"Your password is changed",doneP:"Use it the next time you log in, on any device.",login:"Log in",ePw:"Use at least 8 characters, and mix in letters, numbers or symbols.",ePw2:"The passwords don't match."};
FAMA.T.ar={eyebrow:"مساعدة في كلمة السر",title:"اختار كلمة سر جديدة",email:"الإيميل",fromLink:"اتملى من رابط التغيير.",pw:"كلمة السر الجديدة",pw2:"تأكيد كلمة السر",show:"إظهار",pwHelp:"٨ حروف على الأقل، فيها حروف وأرقام ورموز.",cta:"حفظ كلمة السر",
 doneT:"كلمة السر اتغيرت",doneP:"استخدمها المرة الجاية وإنت بتسجل دخول من أي جهاز.",login:"تسجيل الدخول",ePw:"استخدم ٨ حروف على الأقل، وخلّط بين حروف وأرقام ورموز.",ePw2:"كلمتين السر مش زي بعض."};
const {t}=FAMA;FAMA.apply();const $=id=>document.getElementById(id);
$("pw").addEventListener("input",()=>$("meter").dataset.s=FAMA.strength($("pw").value));
$("form").addEventListener("submit",e=>{e.preventDefault();
  const a=FAMA.fieldError($("pw"),FAMA.strength($("pw").value)<3?t("ePw"):"");
  const b=FAMA.fieldError($("pw2"),$("pw2").value!==$("pw").value||!$("pw2").value?t("ePw2"):"");
  if(!a){$("pw").focus();return} if(!b){$("pw2").focus();return}
  $("ask").hidden=true;$("done").hidden=false;
});
</script>
</body></html>
